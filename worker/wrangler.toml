# Cloudflare Worker of the Bible app (see README, "Публікація в Telegram")
name = "bible-worker"
main = "src/index.ts"
compatibility_date = "2025-06-01"

[vars]
FIREBASE_PROJECT_ID = "bible-ukr"
ALLOWED_ORIGINS = "https://garevna.github.io,https://kcc-bible.pp.ua,https://www.kcc-bible.pp.ua,https://kcc-bible.pages.dev,http://localhost:5173,http://localhost:4179"
# set in the Cloudflare dashboard (Workers > bible-worker > Settings > Variables) or in .dev.vars:
#   TELEGRAM_CHAT_ID  the channel: @name or the -100… id
#   OWNERS            user ids and verified emails of the owners (admins that the dashboard cannot change), separated by commas
# secret: npx wrangler secret put TELEGRAM_BOT_TOKEN

# users who signed in, with their roles (see src/users.ts)
[[kv_namespaces]]
binding = "USERS"
id = "2c3fc90d1bc749bb9b3de8c26513ea17"
preview_id = "8bb220c5ec034f05ae28521991f64527"

# messages between ministers, kept for a day (see src/messages.ts)
[[d1_databases]]
binding = "DB"
database_name = "bible-messages"
database_id = "ec8db852-55f0-4d6c-a4ae-4bcfe7a674a7"
migrations_dir = "migrations"

# once a day the expired messages are deleted
[triggers]
crons = ["0 3 * * *"]
