name: CI / Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Firebase web config comes from the repository variables
# (Settings > Secrets and variables > Actions > Variables). It is not secret:
# it ends up in the built JavaScript anyway; access is guarded by firestore.rules.
env:
  VITE_API_KEY: ${{ vars.VITE_API_KEY }}
  VITE_API_ID: ${{ vars.VITE_API_ID }}
  VITE_API_DOMAIN: ${{ vars.VITE_API_DOMAIN }}
  VITE_PROJECT_ID: ${{ vars.VITE_PROJECT_ID }}
  VITE_STORAGE_BACKET: ${{ vars.VITE_STORAGE_BACKET }}
  VITE_MESSAGING_SENDER_ID: ${{ vars.VITE_MESSAGING_SENDER_ID }}
  VITE_WORKER_URL: ${{ vars.VITE_WORKER_URL }}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: Enable pnpm
        run: corepack enable pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Install Chromium for end-to-end tests
        run: pnpm exec playwright install --with-deps chromium

      - name: End-to-end tests
        run: pnpm test:e2e
        env:
          PW_CHANNEL: chromium

      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: test-results
          retention-days: 7

  deploy:
    # only the main branch is published, after the checks pass
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: Enable pnpm
        run: corepack enable pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm exec vite build
        env:
          # /bible/ on garevna.github.io (the own domain is deployed by the deploy-domain job)
          BASE_PATH: ${{ vars.BASE_PATH || '/bible/' }}

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v4

  deploy-domain:
    # the same app on the own domain (kcc-bible.pp.ua) through Cloudflare Pages, next to GitHub Pages:
    # if the domain is lost, garevna.github.io/bible keeps working
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: No Cloudflare token yet
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: echo "::notice::CLOUDFLARE_API_TOKEN is not set, the domain is not deployed (see README)"

      - uses: actions/checkout@v4
        if: env.CLOUDFLARE_API_TOKEN != ''

      - uses: actions/setup-node@v4
        if: env.CLOUDFLARE_API_TOKEN != ''
        with:
          node-version-file: .node-version

      - name: Enable pnpm
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: corepack enable pnpm

      - name: Install dependencies
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: pnpm install --frozen-lockfile

      - name: Build for the root of the domain
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: pnpm exec vite build
        env:
          BASE_PATH: /

      - name: Deploy to Cloudflare Pages
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: pnpm --filter bible-worker exec wrangler pages deploy ../dist --project-name kcc-bible --branch main
